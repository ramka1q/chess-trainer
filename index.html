/* chess.com-style verdicts. Fitted on 6,208 moves of your 94 chess.com games (no ratings used):
   83% exact match on games the fit never saw (was 81%). */
const CCP={k:0.0035,tM:0.12,tB:0.2,bKeep:200,bookN:3,bookL:0.05,mmc:0,mlA:-500,mlB:-300,cap:-100,g:0.08};
function ccClassify(mvs,rev){
  const E=cp=>1/(1+Math.exp(-CCP.k*Math.max(-2000,Math.min(2000,cp))));const out=[];
  for(let i=0;i<mvs.length;i++){
    const R=rev[i],mv=mvs[i];if(!R){out.push('');continue}
    const cb=R.cb,ca=R.s!=null?R.s:(mv.color==='w'?R.e:-R.e),loss=E(cb)-E(ca);
    const P=rev[i-1],prevBad=i>0&&['mistake','blunder','incorrect'].includes(out[i-1]);
    const mateLost=cb>-9000&&ca<=-9000,mateMissed=cb>=9000&&ca<9000;let c='';
    if(i<CCP.bookN&&loss<CCP.bookL&&Math.abs(cb)<150)c='book';
    else if(mateMissed&&ca>=CCP.mmc)c='incorrect';
    else if(mateLost)c=cb<CCP.mlA?'':cb<CCP.mlB?'mistake':'blunder';   /* allowing mate when already lost is not news */
    else if(loss>=CCP.tB)c='blunder';else if(loss>=CCP.tM)c='mistake';
    if(c==='blunder'&&ca>=CCP.bKeep)c='mistake';                          /* still clearly better after it: only a mistake */
    /* opponent just erred and you let the chance go without ending up worse than before = Miss */
    if((c==='mistake'||c==='blunder')&&prevBad&&!mateLost&&P&&ca>=Math.min(-P.cb,CCP.cap))c='incorrect';
    /* the best move right after an opponent error, clearly better than the alternatives = Great */
    if(!c&&prevBad&&R.b===mUci(mv)&&R.sc!=null&&Math.abs(cb)<9000&&E(cb)-E(R.sc)>=CCP.g)c='great_find';
    out.push(c);

  const lb=out.lastIndexOf('book');for(let i=0;i<lb;i++)if(!out[i])out[i]='book';
  return out.map(c=>c==='incorrect'?'miss':c==='great_find'?'great':c);

    if(!ok){done=true;board.badge={sq:m.to,cls:'miss'};board.render();snd('bad');
      setTimeout(()=>{if(!alive)return;g.undo();board.last=null;board.badge=null;board.arrows=[{from:exp.slice(0,2),to:exp.slice(2,4),c:'g'}];board.render();cb.onResult(false,exp,{played:mUci(mv),fen:fenB,step})},450);return}
    step++;

    setTimeout(()=>{if(!alive)return;const r=g.move(uciObj(P.sol[step]));if(r){board.last=[r.from,r.to];board.render();moveSound(r,g)}step++},280);

    if(ended)return;ended=true;clearInterval(tm);board.canMove=()=>false;
    S.rush=S.rush||{best:0,runs:[]};const rec=score>S.rush.best;if(rec)S.rush.best=score;S.rush.runs.push({d:Date.now(),score});if(S.rush.runs.length>100)S.rush.runs.shift();
    addXP(score*3,'штурм задач');save();if(rec){confetti();snd('win')}
    modal(`<div style="font-size:54px">${rec?'🏆':'⏱'}</div><h2>${rec?'Новий рекорд!':'Штурм завершено'}</h2><p class="mut">${why}. Розв’язано задач: <b>${score}</b>. Рекорд: <b>${S.rush.best}</b>.</p>
      <p class="small mut" style="text-align:left">Порада: у штурмі ти тренуєш швидке бачення простих мотивів. Якщо помиляєшся на перших задачах, значить поспішаєш: краще 2 секунди перевірити, ніж втратити «життя».</p>
      <div class="row"><button class="btn" id="rzA">Ще раз</button><button class="btn g" id="rzB">Вийти</button></div>`);
    $('#rzA').onclick=()=>{closeModal();showView('rush');startRush()};$('#rzB').onclick=()=>{closeModal();showView('rush')};
  }
  tm=setInterval(()=>{if(!me.alive)return;const left=DUR-(Date.now()-t0);const e=$('#rzT');if(e){e.textContent=fmtTime(Math.max(0,left));if(left<30000)e.style.color='var(--red)'}if(left<=0)finish('Час вийшов')},250);
  $('#pf').style.display='flex';$('#pf').innerHTML=`<button class="btn g sm" id="rzStop">Зупинити</button>`;$('#rzStop').onclick=()=>finish('Ти зупинив штурм');
  next();
  return me;
}

/* ---------- 🪵 WOODPECKER: the same set again and again, faster every cycle ---------- */
async function buildWoodSet(n,onProg){
  const set=[];const seenIds=new Set();
  while(set.length<n){const P=await fetchPuzzle('mix',S.pzDiff==='harder'?'normal':'easier');if(seenIds.has(P.id))continue;seenIds.add(P.id);set.push({id:P.id,fen:P.fen,last:P.last,sol:P.sol,rating:P.rating,themes:P.themes});onProg&&onProg(set.length)}
  return set;
}
function WoodRun(opt){
  const me={alive:true,stop(){me.alive=false;clearInterval(tm);if(sv)sv.stop()}};
  const W=S.wood;const order=shuffle(W.set.map((_,i)=>i));let k=0,ok=0,t0=Date.now(),tm=null,sv=null,res=[];
  function ui(msg,kind){
    $('#pb').innerHTML=`<div class="card row" style="justify-content:space-between"><div><div class="small mut">Коло ${W.cycles.length+1}</div><div class="big" id="wdT">${fmtTime(Date.now()-t0)}</div></div><div style="text-align:right"><div class="small mut">Задача</div><div class="big">${Math.min(k+1,order.length)}/${order.length}</div></div></div>
      <div class="dots">${order.map((_,i)=>`<span class="${i<res.length?(res[i]?'ok':'no'):(i===k?'cur':'')}"></span>`).join('')}</div><div id="coachBox"></div>
      <div class="card small mut">🪵 Метод «Дятел»: ті самі задачі коло за колом. Мозок перестає рахувати і починає <b>впізнавати</b> мотиви, як сильні гравці.${W.cycles.length?` Минуле коло: <b>${fmtTime(W.cycles[W.cycles.length-1].ms)}</b>, правильно ${W.cycles[W.cycles.length-1].ok}/${W.cycles[W.cycles.length-1].n}.`:''}</div>`;
    if(msg)coachSay(msg,kind);
  }
  function next(){
    if(!me.alive)return;if(k>=order.length){finish();return}
    const P=W.set[order[k]];
    sv=solvePuzzle(P,{onResult:(good,exp)=>{res.push(good);if(good)ok++;k++;
      if(!good){ui(`❌ Правильно було <b>${esc(sanOf(P.fen,exp))}</b> (зелена стрілка). Запам’ятай: у наступному колі ця задача буде знову.`,'bad');setTimeout(next,1800)}else setTimeout(next,300)}});
    ui(`Задача ${k+1}. Хід ${sv.side==='w'?'білих':'чорних'}.`);
  }
  function finish(){
    clearInterval(tm);board.canMove=()=>false;const ms=Date.now()-t0;
    const prev=W.cycles[W.cycles.length-1];W.cycles.push({d:Date.now(),ms,ok,n:order.length});save();addXP(ok*2,'коло «Дятла»');
    const faster=prev&&ms<prev.ms;if(faster){snd('win');confetti()}
    modal(`<div style="font-size:54px">🪵</div><h2>Коло ${W.cycles.length} завершено</h2><p class="mut">Час: <b>${fmtTime(ms)}</b>${prev?` (минулого разу ${fmtTime(prev.ms)}${faster?', швидше! 🔥':''})`:''}. Правильно: <b>${ok}/${order.length}</b>.</p>
      <p class="small mut" style="text-align:left">${W.cycles.length>=6?'Ти пройшов 6+ кіл. Якщо розв’язуєш майже все швидко, створи новий набір.':'Повтори це коло завтра. Мета: кожного разу швидше і без помилок.'}</p><button class="btn" onclick="closeModal();showView('rush')" style="width:100%">Добре</button>`);
  }
  tm=setInterval(()=>{const e=$('#wdT');if(e)e.textContent=fmtTime(Date.now()-t0)},500);
  $('#pf').style.display='flex';$('#pf').innerHTML=`<button class="btn g sm" id="wdStop">Вийти</button>`;$('#wdStop').onclick=()=>{me.stop();showView('rush')};
  next();return me;
}

/* ---------- 🧮 CALCULATION: see the moves only as text, find the final move in your head ---------- */
function CalcRun(opt){ /* opt:{n,onEnd(perfect),top} */
  const me={alive:true,results:[],stop(){me.alive=false}};
  let P=null,g0=null,gEnd=null,from=null,answered=false,peek=false,loading=true;
  function ui(msg,kind){
    const n=opt.n;
    $('#pb').innerHTML=`${opt.top||''}${n?`<div class="dots">${Array.from({length:n},(_,i)=>`<span class="${i<me.results.length?(me.results[i]?'ok':'no'):(i===me.results.length?'cur':'')}"></span>`).join('')}</div>`:''}<div id="coachBox"></div>
      ${P?`<div class="card"><h4>Ходи (рахуй у голові, дошка не рухається!)</h4><div style="font-size:18px;font-weight:700;line-height:1.6">${movesText()}</div></div>`:''}
      <div class="card small mut">🧮 Так тренується <b>розрахунок</b>: сильні гравці бачать позицію через 3–5 ходів, не пересуваючи фігур. Натисни на поле, звідки ходить фігура, а потім на поле, куди вона йде, <b>у фінальній позиції</b>.</div>`;
    if(msg)coachSay(msg,kind);
    $('#pf').style.display='flex';
    $('#pf').innerHTML=loading?'':answered?`<button class="btn" id="clNext">Далі ➜</button>`:`<button class="btn g sm" id="clPeek">👁 Подивитися фінальну позицію</button><button class="btn g sm" id="clReset">↺ Скинути вибір</button>`;
    if($('#clNext'))$('#clNext').onclick=next;
    if($('#clPeek'))$('#clPeek').onclick=()=>{peek=true;board.set(new Chess(gEnd.fen()));board.onClick=click;ui('Ти подивився, тож цю позицію не зараховано як ідеальну. Тепер знайди хід.','warn')};
    if($('#clReset'))$('#clReset').onclick=()=>{from=null;board.marks={};board.render()};
  }
  function movesText(){const t=new Chess(P.fen);let s='',k=0;const shown=P.sol.slice(0,-1);
    for(const u of shown){const m=t.move(uciObj(u));const no=Math.floor(k/2)+1;s+=(m.color==='w'?`${no}. `:(k===0?`${no}… `:''))+m.san+' ';k++}
    const last=new Chess(P.fen);shown.forEach(u=>last.move(uciObj(u)));s+=`<span style="color:var(--green)">${last.turn()==='w'?Math.floor(k/2)+1+'. ':''}?</span>`;return s}
  async function next(){
    if(!me.alive)return;
    if(opt.n&&me.results.length>=opt.n){opt.onEnd&&opt.onEnd(me.results.every(x=>x),me.results);return}
    answered=false;from=null;peek=false;loading=true;P=null;board.clear();board.onClick=null;ui('Завантажую позицію…');
    const lvl=opt.n?(me.results.filter(x=>x).length>=3?'mateIn3':'mateIn2'):(S.calcLvl||'mateIn2');
    try{for(let t=0;t<6;t++){P=await getPuzzle(lvl,'easier');if(P.sol.length>=3)break}}catch(e){ui('Не вдалося завантажити позицію.','bad');return}
    if(!me.alive)return;
    loading=false;g0=new Chess(P.fen);gEnd=new Chess(P.fen);P.sol.slice(0,-1).forEach(u=>gEnd.move(uciObj(u)));
    board.flip=g0.turn()==='b';board.set(g0);board.last=P.last?[P.last.slice(0,2),P.last.slice(2,4)]:null;board.render();board.canMove=()=>false;board.onClick=click;
    players(plHtml('Суперник','',other(g0.turn())),plHtml('Ти',g0.turn()==='w'?'білі':'чорні',g0.turn()));
    ui(`<div class="t">Уяви, що зіграно ці ходи</div>Дошка показує початкову позицію. Знайди <b>останній хід</b> (часто це мат), рахуючи все в голові.`);
  }
  function click(sq){
    if(answered)return;
    if(!from){const p=gEnd.get(sq);if(!p||p.color!==gEnd.turn()){snd('bad');coachSay(`На полі ${sq} у фінальній позиції немає твоєї фігури. Подумай ще: де вона стоїть після цих ходів?`,'warn');return}from=sq;board.marks={[sq]:'pick'};board.render();snd('click');return}
    const exp=P.sol[P.sol.length-1];const t=new Chess(gEnd.fen());const mv=t.move({from,to:sq,promotion:'q'});
    if(!mv){coachSay('Така фігура туди не ходить у фінальній позиції. Обери поле ще раз.','warn');from=null;board.marks={};board.render();return}
    answered=true;const ok=mUci(mv).slice(0,4)===exp.slice(0,4)||t.in_checkmate();const perfect=ok&&!peek;me.results.push(perfect);
    board.set(gEnd);board.last=[exp.slice(0,2),exp.slice(2,4)];board.marks={};board.arrows=[{from:exp.slice(0,2),to:exp.slice(2,4),c:ok?'g':'r'}];board.render();
    S.calc=S.calc||{ok:0,n:0};S.calc.n++;if(perfect)S.calc.ok++;save();
    if(perfect){snd('good');addXP(8,'розрахунок')}else snd('bad');
    ui(ok?`<div class="t">✅ ${esc(mv.san)}${t.in_checkmate()?': мат!':''}</div>${peek?'Правильно, але ти підглядав.':'Ти все порахував у голові. Чудово!'} Ось фінальна позиція.`:`<div class="t">❌ Не той хід</div>Правильно: <b>${esc(sanOf(gEnd.fen(),exp))}</b>. Подивись на фінальну позицію і порівняй з тим, що ти уявляв.`,ok?'good':'bad');
  }
  next();return me;
}
function viewCalc(){
  board.clear();board.flip=false;board.set(new Chess());players('','');
  panel('🧮 Розрахунок',`<div id="coachBox"></div><div class="card"><h4>Складність</h4><div class="chips">${[['mateIn2','2 ходи наперед'],['mateIn3','4 ходи наперед'],['mateIn4','6 ходів наперед']].map(([k,n])=>`<button class="chip ${(S.calcLvl||'mateIn2')===k?'on':''}" data-k="${k}">${n}</button>`).join('')}</div>
    <div class="small mut" style="margin-top:8px">Правильно: <b>${(S.calc&&S.calc.ok)||0}</b> з ${(S.calc&&S.calc.n)||0}</div></div>`,`<button class="btn" id="clGo">Почати</button>`);
  coachSay('Тут фігури <b>не рухаються</b>. Ти бачиш позицію і список ходів, а знайти фінальний хід треба в голові. Це головна вправа, щоб рахувати варіанти на 3+ ходи.');
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.calcLvl=b.dataset.k;save();viewCalc()});
  $('#clGo').onclick=()=>{panel('🧮 Розрахунок','','');CUR=CalcRun({})};
}

/* ---------- ♟ STRATEGY: concepts recognised on real positions (answers computed exactly) ---------- */
function pawnList(g){const res={w:[],b:[]};const B=g.board();for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=B[r][f];if(p&&p.type==='p')res[p.color].push({f,r:7-r,sq:SQN(f,7-r)})}return res}
const STRAT={
  outpost:{n:'Форпост для коня',i:'🐴',ask:s=>`Познач усі <b>форпости</b> для ${s==='w'?'білих':'чорних'}: поля на половині суперника, які захищає твій пішак і які <b>жоден</b> пішак суперника вже ніколи не зможе атакувати.`,
    lesson:'<b>Форпост</b> — поле, звідки фігуру неможливо прогнати пішаком. Кінь на форпості на 5–6-й горизонталі часто сильніший за туру: він контролює 8 полів у таборі суперника і стоїть там вічно.<br><br><b>План:</b> знайди дірку в пішаках суперника → підтримай її своїм пішаком → веди туди коня (часто через 2–3 ходи).',
    angle:'middlegame',kind:'sq',solve:(g,s)=>{const P=pawnList(g),o=other(s),out=[];const rows=s==='w'?[4,5]:[3,2];
      for(const r of rows)for(let f=0;f<8;f++){const sq=SQN(f,r),pc=g.get(sq);if(pc&&(pc.color===o||pc.type==='p'))continue;
        const sup=P[s].some(p=>Math.abs(p.f-f)===1&&p.r===(s==='w'?r-1:r+1));if(!sup)continue;
        const att=P[o].some(p=>Math.abs(p.f-f)===1&&(s==='w'?p.r>r:p.r<r));if(att)continue;out.push(sq)}return out}},
  openfile:{n:'Відкриті лінії',i:'🏁',ask:()=>`Познач усі <b>відкриті лінії</b> — вертикалі, на яких немає жодного пішака (ні білого, ні чорного). Натисни на будь-яке поле лінії.`,
    lesson:'<b>Тури</b> люблять відкриті лінії: там вони б’ють на всю довжину дошки. Тура на відкритій лінії часто проривається на 7-му горизонталь і там збирає пішаків.<br><br><b>План:</b> знайди відкриту лінію → постав туди туру (а краще дві, одна за одною) → вторгнись на 7-му горизонталь.',
    angle:'middlegame',kind:'file',solve:g=>{const P=pawnList(g);const out=[];for(let f=0;f<8;f++)if(!P.w.some(p=>p.f===f)&&!P.b.some(p=>p.f===f))out.push('abcdefgh'[f]);return out}},
  isolated:{n:'Ізольовані пішаки',i:'🏝',ask:()=>`Познач усі <b>ізольовані пішаки</b> (обох кольорів): на сусідніх вертикалях у них немає своїх пішаків.`,
    lesson:'<b>Ізольований пішак</b> не може захищатися іншим пішаком, тож його доводиться захищати фігурами. Поле перед ним — чудовий форпост для суперника.<br><br><b>План проти ізольованого:</b> заблокуй його фігурою (найкраще конем) → атакуй кількома фігурами → розміняй фігури, бо в ендшпілі ізольований пішак слабший.',
    angle:'middlegame',kind:'piece',solve:g=>{const P=pawnList(g);const out=[];for(const c of['w','b'])P[c].forEach(p=>{if(!P[c].some(q=>Math.abs(q.f-p.f)===1))out.push(p.sq)});return out}},
  passed:{n:'Прохідні пішаки',i:'🏃',ask:()=>`Познач усі <b>прохідні пішаки</b> (обох кольорів): перед ними і на сусідніх вертикалях немає пішаків суперника.`,
    lesson:'<b>Прохідний пішак</b> може дійти до ферзя, бо його не зупинить жоден пішак. В ендшпілі прохідний пішак часто вирішує партію.<br><br><b>Правило:</b> «прохідні пішаки треба просувати» (Нимцович). Підтримуй його королем і турою <b>позаду</b> нього, а прохідного пішака суперника блокуй фігурою прямо перед ним.',
    angle:'endgame',kind:'piece',solve:g=>{const P=pawnList(g);const out=[];for(const c of['w','b']){const o=other(c);P[c].forEach(p=>{if(!P[o].some(q=>Math.abs(q.f-p.f)<=1&&(c==='w'?q.r>p.r:q.r<p.r)))out.push(p.sq)})}return out}},
  badbishop:{n:'Поганий слон',i:'⛪',ask:()=>`Познач <b>поганих слонів</b>: слон поганий, якщо його власні пішаки стоять на полях його кольору (3 і більше, і помітно більше, ніж на іншому кольорі).`,
    lesson:'<b>Поганий слон</b> упирається у власних пішаків: вони стоять на полях того ж кольору і закривають йому діагоналі. Він став «великим пішаком».<br><br><b>План:</b> став своїх пішаків на поля <b>протилежного</b> кольору до свого слона; поганого слона розмінюй або виводь за ланцюг пішаків; а проти поганого слона суперника тримай коня на форпості.',
    angle:'middlegame',kind:'piece',solve:g=>{const P=pawnList(g);const out=[];const B=g.board();for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=B[r][f];if(!p||p.type!=='b')continue;const rr=7-r,col=(f+rr)%2;const same=P[p.color].filter(q=>(q.f+q.r)%2===col).length,diff=P[p.color].length-same;if(same>=3&&same>=diff+2)out.push(SQN(f,rr))}return out}},
  worst:{n:'План: найгірша фігура',i:'🧭',ask:s=>`Коли тактики немає, план простий: <b>покращ найгіршу фігуру</b>. Познач фігуру ${s==='w'?'білих':'чорних'} (кінь, слон, тура чи ферзь), у якої <b>найменше ходів</b>.`,
    lesson:'Коли тактики немає, сильні гравці питають: <b>«Яка моя фігура найгірша?»</b> — і покращують саме її. Фігура, у якої мало ходів, майже не грає. Перевести її на активне поле часто важливіше за будь-яку атаку.<br><br><b>Як скласти план:</b> 1) немає шахів, взять, загроз? 2) знайди найгіршу фігуру → 3) знайди для неї найкраще поле → 4) прокладай туди шлях за 2–3 ходи.',
    angle:'middlegame',kind:'piece',solve:(g,s)=>{const t=new Chess();if(!t.load(setTurn(g.fen(),s)))return[];const mob={};t.moves({verbose:true}).forEach(m=>{if('nbrq'.includes(m.piece))mob[m.from]=(mob[m.from]||0)+1});
      const B=g.board();const cand=[];for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=B[r][f];if(p&&p.color===s&&'nbrq'.includes(p.type)){const sq=SQN(f,7-r);cand.push({sq,m:mob[sq]||0})}}
      if(cand.length<3)return null;cand.sort((a,b)=>a.m-b.m);if(cand[1].m-cand[0].m<2)return null;return[cand[0].sq]}},
};
function StrategyRun(opt){ /* opt:{topic,n,onEnd(perfect),top} */
  const me={alive:true,results:[],stop(){me.alive=false}};
  const T=STRAT[opt.topic];let g=null,side='w',ans=[],picked=new Set(),checked=false,first=true,loading=true;
  function ui(msg,kind){
    const n=opt.n;
    $('#pb').innerHTML=`${opt.top||''}${n?`<div class="dots">${Array.from({length:n},(_,i)=>`<span class="${i<me.results.length?(me.results[i]?'ok':'no'):(i===me.results.length?'cur':'')}"></span>`).join('')}</div>`:''}<div id="coachBox"></div>
      <div class="card small"><h4>${T.i} ${T.n}</h4>${T.lesson}</div>`;
    if(msg)coachSay(msg,kind);
    $('#pf').style.display='flex';$('#pf').innerHTML=loading?'':checked?`<button class="btn" id="stNext">Далі ➜</button>`:`<button class="btn" id="stChk">Перевірити</button>`;
    if($('#stNext'))$('#stNext').onclick=next;if($('#stChk'))$('#stChk').onclick=check;
  }
  function paint(){board.marks={};if(T.kind==='file')picked.forEach(f=>{for(let r=1;r<=8;r++)board.marks[f+r]='pick'});else picked.forEach(s=>board.marks[s]='pick');board.render()}
  async function next(){
    if(!me.alive)return;
    if(opt.n&&me.results.length>=opt.n){opt.onEnd&&opt.onEnd(me.results.every(x=>x),me.results);return}
    checked=false;picked=new Set();board.clear();loading=true;g=null;ui('Шукаю позицію з реальної партії…');
    for(let t=0;t<12;t++){let P;try{P=await getPuzzle(T.angle,'easier')}catch(e){ui('Не вдалося завантажити позицію.','bad');return}
      if(!me.alive)return;const gg=new Chess(P.fen);const s=gg.turn();const a=T.solve(gg,s);
      if(a&&a.length>=1&&a.length<=4){g=gg;side=s;ans=a;break}}
    if(!g){ui('Не знайшлося відповідної позиції, спробуй ще раз.','bad');return}
    loading=false;
    board.flip=side==='b';board.set(g);board.canMove=()=>false;
    players(plHtml('Суперник','',other(side)),plHtml('Ти',side==='w'?'білі':'чорні',side));
    board.onClick=sq=>{if(checked)return;
      if(T.kind==='file'){const f=sq[0];picked.has(f)?picked.delete(f):picked.add(f)}
      else{const p=g.get(sq);if(T.kind==='piece'&&!p){snd('bad');return}picked.has(sq)?picked.delete(sq):picked.add(sq)}
      snd('click');paint()};
    first=false;ui(`<div class="t">${T.i} Завдання</div>${T.ask(side)}`);
  }
  function check(){
    checked=true;const set=new Set(ans);let miss=0,bad=0;board.marks={};
    const mark=(k,c)=>{if(T.kind==='file'){for(let r=1;r<=8;r++)board.marks[k+r]=c}else board.marks[k]=c};
    set.forEach(k=>{if(picked.has(k))mark(k,'good');else{mark(k,'miss');miss++}});picked.forEach(k=>{if(!set.has(k)){mark(k,'bad');bad++}});board.render();
    const ok=!miss&&!bad;me.results.push(ok);S.strat=S.strat||{};const r=S.strat[opt.topic]||(S.strat[opt.topic]={ok:0,n:0});r.n++;if(ok)r.ok++;save();
    if(ok){snd('good');addXP(6,T.n)}else snd('bad');
    const list=[...set].map(k=>T.kind==='file'?`лінія <b>${k}</b>`:`<b>${k}</b>`).join(', ');
    let extra='';if(opt.topic==='worst'&&ans[0]){const p=g.get(ans[0]);extra=`<div class="mut small" style="margin-top:4px">${NAME[p.type][0].toUpperCase()+NAME[p.type].slice(1)} на ${ans[0]} майже не має ходів. Подумай: на яке поле перевести цю фігуру за 2–3 ходи?</div>`}
    ui(ok?`<div class="t">✅ Точно!</div>${list}.${extra}`:`<div class="t">❌ Не зовсім</div>${miss?'<span style="color:#b8860b">Жовтим</span>: пропущено. ':''}${bad?'<span style="color:#d33">Червоним</span>: це не те. ':''}<div style="margin-top:4px">Правильно: ${list}.</div>${extra}`,ok?'good':'bad');
  }
  next();return me;
}

function SelfReview(gm,onDone){
  const me={alive:true,stop(){me.alive=false;document.removeEventListener('keydown',key);$('#evalbar').style.visibility=''}};
  const fens=[new Chess().fen()];const mvs=[];{const t=new Chess();for(const s of gm.sans){const m=t.move(s);if(!m)break;mvs.push(m);fens.push(t.fen())}}
  const flags=new Set(),notes={};let idx=-1;
  $('#evalbar').style.visibility='hidden';
  board.clear();board.flip=gm.color==='b';board.canMove=()=>false;
  function show(){
    const g=new Chess(fens[idx+1]);board.g=g;const mv=mvs[idx];board.last=mv?[mv.from,mv.to]:null;board.badge=mv&&flags.has(idx)?{sq:mv.to,cls:'mistake'}:null;board.arrows=[];board.render();
    const mine=mv&&mv.color===gm.color;

      ${mine?`<div class="card"><button class="btn ${flags.has(idx)?'':'g'} sm" id="srFlag" style="width:100%">${flags.has(idx)?'🚩 Позначено як помилку (зняти)':'🚩 Тут я помилився'}</button>
        <textarea id="srNote" placeholder="Що ти думав на цьому ході? (необов’язково)" style="width:100%;margin-top:8px;min-height:54px;background:#1f1e1b;color:#fff;border:1px solid #3c3a37;border-radius:6px;padding:6px;font-family:inherit">${esc(notes[idx]||'')}</textarea></div>`:''}
      <div class="moves" id="mvList" style="max-height:300px">${rows.join('')}</div>
      <div class="card small mut" style="margin-top:8px">Позначено ходів: <b>${flags.size}</b>. Шкалу оцінки сховано, щоб ти думав сам.</div>`;
    if(!mv)coachSay(`<div class="t">🧠 Спершу розбери сам</div>Сильні гравці спочатку самі шукають свої помилки, а вже потім дивляться рушій. Прогорни партію (◀ ▶ або ← →) і познач 🚩 ходи, де, на твою думку, ти помилився. Можеш дописати, що думав. Потім порівняємо з рушієм.`);
    else coachSay(mine?`Твій хід <b>${esc(mv.san)}</b>. Він був добрим чи ні? Що загрожував суперник?`:`Хід суперника <b>${esc(mv.san)}</b>. Що він погрожував?`);
    if($('#srFlag'))$('#srFlag').onclick=()=>{flags.has(idx)?flags.delete(idx):flags.add(idx);show()};
    if($('#srNote'))$('#srNote').oninput=e=>{notes[idx]=e.target.value};
    $('#mvList').querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>{idx=+e.dataset.i;show()});
    const cur=$('#mvList').querySelector('.cur');if(cur)cur.scrollIntoView({block:'nearest'});
    $('#pf').style.display='flex';$('#pf').innerHTML=`<button class="btn g sm" id="srP">◀</button><button class="btn g sm" id="srN">▶</button><button class="btn" id="srDone">✅ Порівняти з рушієм</button>`;
    $('#srP').onclick=()=>{idx=Math.max(-1,idx-1);show()};$('#srN').onclick=()=>{idx=Math.min(mvs.length-1,idx+1);show()};$('#srDone').onclick=compare;
  }
  function key(e){if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight'){idx=Math.min(mvs.length-1,idx+1);show()}else if(e.key==='ArrowLeft'){idx=Math.max(-1,idx-1);show()}}
  document.addEventListener('keydown',key);
  function compare(){
    me.stop();
    const CC=ccClassify(mvs,gm.rev);const eng=new Set();mvs.forEach((m,i)=>{if(m.color===gm.color&&['mistake','blunder','miss'].includes(CC[i]))eng.add(i)});
    const found=[...eng].filter(i=>flags.has(i)),missed=[...eng].filter(i=>!flags.has(i)),extra=[...flags].filter(i=>!eng.has(i));
    const pct=eng.size?Math.round(found.length/eng.size*100):100;
    gm.self={flags:[...flags],notes,found:found.length,total:eng.size,extra:extra.length,d:Date.now()};save();
    addXP(10+found.length*3,'самостійний розбір');
    const nm=i=>`${Math.floor(i/2)+1}${i%2?'…':'.'} ${esc(mvs[i].san)}`;
    modal(`<div style="font-size:50px">${pct>=70?'🦅':pct>=40?'👀':'🔍'}</div><h2>Ти знайшов ${found.length} з ${eng.size} помилок</h2>
      <div class="card small" style="text-align:left">${found.length?`<div>✅ <b>Побачив сам:</b> ${found.map(nm).join(', ')}</div>`:''}${missed.length?`<div style="margin-top:4px">❌ <b>Пропустив:</b> ${missed.map(nm).join(', ')}</div>`:''}${extra.length?`<div style="margin-top:4px">⚠️ <b>Насправді нормальні ходи:</b> ${extra.map(nm).join(', ')}</div>`:''}</div>
      <p class="small mut">Подивись у повному розборі саме ті помилки, які ти пропустив: це твої «сліпі плями».</p><button class="btn" id="srGo" style="width:100%">Перейти до розбору рушієм ➜</button>`);
    $('#srGo').onclick=()=>{closeModal();onDone()};
  }
  show();return me;
}

function GuessRun(M,onEnd){
  const me={alive:true,stop(){me.alive=false}};
  const full=new Chess();if(/^\s*1\./.test(M.pgn))full.load_pgn(M.pgn);else M.pgn.split(' ').forEach(x=>full.move(x));const H=full.history({verbose:true});
  const g=new Chess();let i=0,score=0,maxScore=0,busy=false;const log=[];
  for(;i<M.from&&i<H.length;i++)g.move(H[i].san);
  board.clear();board.flip=M.side==='b';board.set(g);if(i)board.last=[H[i-1].from,H[i-1].to];board.render();
  players(plHtml(M.side==='w'?'Чорні':'Білі',`(${M.year})`,other(M.side)),plHtml('Ти за майстра',M.side==='w'?'білі':'чорні',M.side));
  board.canMove=()=>!busy&&me.alive&&i<H.length&&g.turn()===M.side;
  function ui(msg,kind){
    $('#pb').innerHTML=`<div class="card row" style="justify-content:space-between"><b>${esc(M.name)}, ${M.year}</b><span class="big" style="font-size:22px">${score}<span class="dim" style="font-size:14px">/${maxScore}</span></span></div><div id="coachBox"></div>
      <div class="card small mut">Вгадай хід майстра. <b>3 бали</b>, якщо збігся; <b>2</b>, якщо твій хід майже такий самий сильний за оцінкою Stockfish; <b>1</b>, якщо трохи гірший.</div>
      ${log.length?`<div class="card small">${log.slice(-6).map(l=>`<div>${l}</div>`).join('')}</div>`:''}`;
    if(msg)coachSay(msg,kind);
  }
  board.onMove=async m=>{
    if(busy)return;const fen=g.fen();const exp=H[i];const t=new Chess(fen);const mv=t.move(m);if(!mv)return;
    busy=true;maxScore+=3;let pts,txt;
    if(mv.san===exp.san){pts=3;txt=`✅ <b>${esc(mv.san)}</b> — точно як у майстра!`}
    else{coachSay('<span class="mut">Порівнюю з ходом майстра…</span>');
      const[a,b]=await Promise.all([coachE.analyse(fen,{depth:14,time:600,searchmoves:mUci(mv)}),coachE.analyse(fen,{depth:14,time:600,searchmoves:exp.from+exp.to+(exp.promotion||'')})]);
      if(!me.alive)return;const d=b.cp-a.cp;pts=d<=30?2:d<=100?1:0;
      txt=`${pts===2?'👍':pts===1?'🤏':'❌'} Ти: <b>${esc(mv.san)}</b>, майстер: <b>${esc(exp.san)}</b>${pts===2?' — майже так само сильно!':pts===1?' — трохи гірше.':' — помітно гірше.'}`}
    score+=pts;log.push(`${Math.floor(i/2)+1}. ${txt}`);
    board.arrows=mv.san===exp.san?[]:[{from:mv.from,to:mv.to,c:'r'},{from:exp.from,to:exp.to,c:'g'}];
    g.move(exp.san);board.last=[exp.from,exp.to];board.render();moveSound(exp,g);i++;
    ui(txt,pts>=2?'good':pts===1?'warn':'bad');
    await sleep(900);if(!me.alive)return;
    if(i<H.length&&g.turn()!==M.side){const o=H[i];g.move(o.san);board.last=[o.from,o.to];board.arrows=[];board.render();moveSound(o,g);i++}
    busy=false;
    if(i>=H.length){finish();return}
    ui(`${txt}<div class="mut small" style="margin-top:4px">Суперник: <b>${esc(H[i-1].san)}</b>. Твій хід!</div>`,pts>=2?'good':pts===1?'warn':'bad');
  };
  function finish(){
    const pct=Math.round(score/Math.max(1,maxScore)*100);S.masters=S.masters||{};const best=S.masters[M.id]||0;if(pct>best)S.masters[M.id]=pct;save();addXP(Math.round(score*1.5),'партія майстра');
    snd('win');modal(`<div style="font-size:54px">🎓</div><h2>${pct}% збігу з майстром</h2><p class="mut">${score} з ${maxScore} балів. ${pct>best?'Новий рекорд для цієї партії!':`Твій рекорд: ${best}%.`}</p><button class="btn" id="gmOk" style="width:100%">Добре</button>`);
    $('#gmOk').onclick=()=>{closeModal();onEnd&&onEnd()};
  }
  ui(`<div class="t">🎓 ${esc(M.name)}</div>${M.intro}<div style="margin-top:4px">Перші ходи вже зіграно. Твій хід!</div>`);
  return me;
}

const TEST_CATS=[['hangingPiece','Висячі фігури'],['fork','Вилки'],['pin','Зв’язки'],['mateIn1','Мат в 1'],['mateIn2','Мат у 2'],['defensiveMove','Захист'],['endgame','Ендшпіль']];

function testDueIn(){const T=S.test;if(!T||!T.attempts||!T.attempts.length)return 0;const last=T.attempts[T.attempts.length-1].d;return Math.max(0,Math.ceil((last+TEST_DAYS*864e5-Date.now())/864e5))}
function TestRun(onEnd){
  const me={alive:true,stop(){me.alive=false;clearInterval(tm);if(sv)sv.stop()}};
  const T=S.test;let k=0,res=[],det=[],sv=null,t0=Date.now(),tm=null;
  function ui(msg,kind){
    $('#pb').innerHTML=`<div class="card row" style="justify-content:space-between"><b>📏 Контрольний тест</b><span class="big" style="font-size:20px">${Math.min(k+1,T.set.length)}/${T.set.length}</span></div>
      <div class="dots">${T.set.map((_,i)=>`<span class="${i<res.length?(res[i]?'ok':'no'):(i===k?'cur':'')}"></span>`).join('')}</div><div id="coachBox"></div>
      <div class="card small mut">Тут немає підказок і повторних спроб: перший хід вирішує. Не поспішай — тест показує твій справжній рівень. Тема позиції захована, як у реальній партії.</div>`;
    if(msg)coachSay(msg,kind);
  }
  function next(){
    if(!me.alive)return;if(k>=T.set.length){finish();return}
    const P=T.set[k];
    sv=solvePuzzle(P,{onResult:(ok,exp,info)=>{res.push(ok);det.push(ok?null:info||null);k++;setTimeout(next,ok?350:1500);if(!ok)ui('❌ Не той хід. Правильний показано стрілкою. Після тесту зможеш переглянути всі помилки.','bad')}});
    ui(`Позиція ${k+1}. Хід ${sv.side==='w'?'білих':'чорних'}. Знайди найкращий хід.`);
  }
  function finish(){
    const ms=Date.now()-t0;const byCat={};T.set.forEach((P,i)=>{const c=byCat[P.cat]||(byCat[P.cat]={ok:0,n:0});c.n++;if(res[i])c.ok++});
    const pct=Math.round(res.filter(x=>x).length/T.set.length*100);
    const prev=T.attempts[T.attempts.length-1];T.attempts.push({d:Date.now(),pct,ms,byCat,res,det});save();addXP(30+pct,'контрольний тест');

      <div class="card small" style="text-align:left">${TEST_CATS.map(([c,n])=>{const b=byCat[c];if(!b)return'';const pb=prev&&prev.byCat&&prev.byCat[c];return `<div class="row" style="justify-content:space-between"><span>${n}</span><span>${b.ok}/${b.n}${pb?` <span class="dim">(було ${pb.ok}/${pb.n})</span>`:''}</span></div>`}).join('')}</div>
      <div class="row">${res.some(x=>!x)?'<button class="btn" id="tsRev">🔍 Переглянути помилки</button>':''}<button class="btn ${res.some(x=>!x)?'g':''}" id="tsOk">Добре</button></div>`);

    if($('#tsRev'))$('#tsRev').onclick=()=>{closeModal();openTestReview(T.attempts.length-1,true)};
  }
  next();return me;
}

async function buildTestSet(onProg){
  const set=[];const seenIds=new Set();
  for(const[cat]of TEST_CATS){let got=0;for(let t=0;t<12&&got<3;t++){const P=await fetchPuzzle(cat,'easier');if(seenIds.has(P.id))continue;seenIds.add(P.id);set.push({id:P.id,fen:P.fen,last:P.last,sol:P.sol,rating:P.rating,cat});got++;onProg&&onProg(set.length)}}
  return shuffle(set);
}

/* ================= 🔄 SYNC between devices (private GitHub gist) =================
   The token lives only on this device (separate key, never synced). Progress is merged field by field,
   so working on two devices offline never loses anything. */
const SYNC_KEY='chesstrainer_sync',SYNC_FILE='chess-trainer-progress.json',SYNC_DESC='Шаховий тренер — прогрес (не видаляй)';
const SITE_URL='https://ramka1q.github.io/chess-trainer/';
var SY={};try{SY=JSON.parse(localStorage.getItem(SYNC_KEY)||'{}')}catch(e){}
const saveSY=()=>{try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}};
/* settings that belong to one device only */
const LOCAL_ONLY=['pcFullSet','devChoice','autoFull','autoEng','noMulti','sound','engineMode','skipVer','lastSeenVer','welcomed','visLvl','calcLvl','clk','cctOn','site','nick','impN'];
function gh(path,opt={}){return fetch('https://api.github.com'+path,{...opt,headers:{Authorization:'Bearer '+SY.token,Accept:'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}})}
function packState(){
  const o={};for(const k in S)if(!LOCAL_ONLY.includes(k))o[k]=S[k];
  /* game reviews are big: send the moves only, the other device re-analyses on open */
  if(o.myGames){const mg={};for(const id in o.myGames){const{rev,...rest}=o.myGames[id];mg[id]={...rest,rv:rev?0:rest.rv}}o.myGames=mg}
  return o;
}
const mx=(a,b)=>Math.max(a||0,b||0);
function mergeState(A,B){ /* A = this device, B = remote; returns merged copy */
  const newer=(B.updatedAt||0)>(A.updatedAt||0)?B:A;const out={...A};
  for(const k of['elo','startUnit','pzDiff','playLevel','pr','dayStreak','lastDay','streak','visRun','lastSmartGame'])if(newer[k]!==undefined)out[k]=newer[k];
  for(const k of['xp','bestStreak','visBest','smart'])out[k]=mx(A[k],B[k]);
  const mapMerge=(a={},b={},f)=>{const o={...a};for(const k in b)o[k]=k in o?f(o[k],b[k]):b[k];return o};
  out.lessons=mapMerge(A.lessons,B.lessons,(x,y)=>({...x,...y,done:!!(x.done||y.done),stars:mx(x.stars,y.stars),runs:mx(x.runs,y.runs),watched:!!(x.watched||y.watched)}));
  out.srs=mapMerge(A.srs,B.srs,(x,y)=>x.box>y.box||(x.box===y.box&&x.due>=y.due)?x:y);
  const cnt=(x,y)=>({ok:mx(x.ok,y.ok),n:mx(x.n,y.n)});
  out.themes=mapMerge(A.themes,B.themes,cnt);out.strat=mapMerge(A.strat,B.strat,cnt);
  for(const k of['quiz','cct','calc'])if(A[k]||B[k])out[k]=cnt(A[k]||{},B[k]||{});
  out.seen=mapMerge(A.seen,B.seen,mx);out.masters=mapMerge(A.masters,B.masters,mx);
  out.days=mapMerge(A.days,B.days,(x,y)=>{const o={...x};for(const k in y)o[k]=mx(x[k],y[k]);return o});
  out.ach=mapMerge(A.ach,B.ach,(x,y)=>Math.min(x,y));
  const byKey=(a=[],b=[],key)=>{const m=new Map();[...a,...b].forEach(x=>{const k=key(x);if(!m.has(k))m.set(k,x)});return[...m.values()]};
  out.games=byKey(A.games,B.games,g=>g.d).sort((x,y)=>x.d-y.d).slice(-200);
  out.mist=(()=>{const m=new Map();[...(A.mist||[]),...(B.mist||[])].forEach(x=>{const o=m.get(x.id);if(!o||(x.box||0)>(o.box||0))m.set(x.id,x)});return[...m.values()].slice(-300)})();
  out.myGames=mapMerge(A.myGames,B.myGames,(x,y)=>(x.rev?x:(y.rev?y:((x.rv||0)>=(y.rv||0)?x:y))));
  if(A.rush||B.rush)out.rush={best:mx(A.rush&&A.rush.best,B.rush&&B.rush.best),runs:byKey(A.rush&&A.rush.runs,B.rush&&B.rush.runs,r=>r.d).slice(-100)};
  if(A.wood||B.wood){const a=A.wood,b=B.wood;out.wood=!a?b:!b?a:(a.cycles.length>=b.cycles.length?a:b)}
  if(A.test||B.test){const a=A.test,b=B.test;const base=!a?b:!b?a:((a.created||0)<=(b.created||0)?a:b);out.test={...base,attempts:byKey(a&&a.attempts,b&&b.attempts,x=>x.d).sort((x,y)=>x.d-y.d)}}
  out.updatedAt=Math.max(A.updatedAt||0,B.updatedAt||0);
  return out;
}
let syncT=null,syncBusy=false,syncQuiet=false;
function syncSoon(){if(!SY||!SY.token||!SY.gist||syncQuiet)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(),20000)} /* not more often: GitHub limits frequent gist updates */
async function readGist(){
  const r=await gh('/gists/'+SY.gist);if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();const f=j.files[SYNC_FILE];if(!f)return null;
  const txt=f.truncated?await (await fetch(f.raw_url)).text():f.content;return JSON.parse(txt||'{}');
}
async function syncNow(manual){
  if(!SY.token||!SY.gist||syncBusy)return;syncBusy=true;
  try{
    const remote=await readGist();
    const before=JSON.stringify(packState());
    const local={};for(const k in S)local[k]=S[k];
    const merged=remote?mergeState(local,remote):local;
    /* lessons are updated in place: a running lesson keeps a reference to its record */
    for(const k in merged){if(LOCAL_ONLY.includes(k))continue;
      if(k==='lessons'&&S.lessons&&merged.lessons){for(const id in merged.lessons){if(S.lessons[id])Object.assign(S.lessons[id],merged.lessons[id]);else S.lessons[id]=merged.lessons[id]}}
      else S[k]=merged[k]}
    const changed=JSON.stringify(packState())!==before;
    syncQuiet=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncQuiet=false;
    const body=JSON.stringify({files:{[SYNC_FILE]:{content:JSON.stringify(packState())}}});
    const r=await gh('/gists/'+SY.gist,{method:'PATCH',body});if(!r.ok)throw new Error('GitHub '+r.status);
    SY.last=Date.now();SY.err='';saveSY();updMe();
    /* something arrived from the other device: refresh overview pages (never interrupt a running exercise) */
    if(changed&&$('#home').style.display!=='none'&&$('#modal').style.display!=='flex'){const v=document.querySelector('#nav a.on');if(v&&['home','stats','review','mygames','test'].includes(v.dataset.v))showView(v.dataset.v)}
    if(manual)toast('✅ Прогрес синхронізовано');
  }catch(e){SY.err=String(e.message||e);saveSY();if(manual)toast('❌ Синхронізація: '+esc(SY.err),5000)}
  syncBusy=false;
}
async function syncConnect(token){

  let gid=null;for(let page=1;page<=5&&!gid;page++){const r=await gh('/gists?per_page=100&page='+page);if(!r.ok)break;const L=await r.json();if(!L.length)break;const f=L.find(g=>g.files&&g.files[SYNC_FILE]);if(f)gid=f.id}
  if(!gid){const r=await gh('/gists',{method:'POST',body:JSON.stringify({description:SYNC_DESC,public:false,files:{[SYNC_FILE]:{content:JSON.stringify(packState())}}})});if(!r.ok)throw new Error('не вдалося створити сховище (GitHub '+r.status+'). Перевір, що ключ має дозвіл «gist».');gid=(await r.json()).id}

}

function viewVision(){
  board.clear();board.set(new Chess(randomPosition()));players('','');
  let task='mixed',lvl=S.visLvl||'easy';
  const ui=()=>{panel('👁 Бачення дошки',`<div id="coachBox"></div><div class="card"><h4>Етап</h4><div class="chips">${Object.entries(VLEVELS).map(([k,[n,m]])=>`<button class="chip ${lvl===k?'on':''}" data-lv="${k}">${n} (0–${m})</button>`).join('')}</div></div><div class="card"><h4>Режим</h4><div class="chips">${[['win','🎁 Що можна виграти'],['danger','⚠️ Що під ударом'],['mixed','🔀 Змішано']].map(([k,n])=>`<button class="chip ${task===k?'on':''}" data-k="${k}">${n}</button>`).join('')}</div></div>
    <div class="card small">Найкраща серія: <b>${S.visBest||0}</b> · Досягнення «Орлине око»: 20 поспіль.</div>`,`<button class="btn" id="vGo">Почати</button>`);
    coachSay('Головний навик для твого рівня: <b>за 3 секунди бачити, що висить</b>. Гросмейстери не рахують, вони просто БАЧАТЬ. Ця вправа тренує саме це.');
    document.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{task=e.dataset.k;ui()});
    document.querySelectorAll('[data-lv]').forEach(e=>e.onclick=()=>{lvl=e.dataset.lv;S.visLvl=lvl;save();ui()});
    $('#vGo').onclick=()=>{panel('👁 Бачення дошки','','');CUR=VisionRun({task,level:lvl})}};
  ui();
}

function viewEndgames(){
  board.clear();board.set(new Chess(ENDGAMES[0].fen));players('','');
  panel('♔ Ендшпіль',`<div id="coachBox"></div><div class="list">${ENDGAMES.map(e=>`<div class="it" data-e="${e.id}"><span style="font-size:22px">${e.icon}</span><span class="nm">${esc(e.name)}<div class="small dim" style="font-weight:400">${e.goal==='mate'?'мат':'у ферзі'} за ≤${e.limit} ходів</div></span></div>`).join('')}</div>`,'');
  coachSay('Якщо ти виграв матеріал, але не вмієш ставити мат, перевага пропаде. Ці ендшпілі треба вміти <b>на автоматі</b>. Захищається Стокфіш на максимальній силі.');
  document.querySelectorAll('[data-e]').forEach(x=>x.onmouseenter=()=>{const e=ENDGAMES.find(q=>q.id===x.dataset.e);board.set(new Chess(e.fen))});
  document.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>{const e=ENDGAMES.find(q=>q.id===x.dataset.e);stopCur();panel(`<span style="cursor:pointer" id="backBtn">←</span> ${e.icon} ${esc(e.name)}`,'','');$('#backBtn').onclick=()=>showView('endgames');CUR=EndgameRun({eg:e})});
}

function showWhatsNew(){
  if(S.lastSeenVer===APP_VERSION)return;
  const prev=S.lastSeenVer,fresh=!prev&&!S.xp;S.lastSeenVer=APP_VERSION;save();
  if(fresh)return; /* brand-new users get the welcome screen instead */
  const vers=Object.keys(CHANGELOG).filter(v=>verNum(v)>verNum(prev||'0')&&verNum(v)<=verNum(APP_VERSION)).sort((a,b)=>verNum(b)-verNum(a));
  if(!vers.length)return;
  modal(`<div style="font-size:50px">🆕</div><h2>Що нового</h2>${vers.map(v=>`<div class="card" style="text-align:left"><b>Версія ${v}</b><ul style="margin:6px 0 0;padding-left:18px">${CHANGELOG[v].map(x=>`<li style="margin:4px 0">${x}</li>`).join('')}</ul></div>`).join('')}<button class="btn" onclick="closeModal()" style="width:100%">Круто!</button>`);
}
